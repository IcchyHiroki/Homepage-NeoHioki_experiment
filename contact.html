<!doctype html>
<html lang="jp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" data-i18n="contact_page_title" />
    <title data-i18n="contact_page_title"></title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="contact">
    <div id="site-header"></div>

    <main>
      <div class="page-hdr">
        <p class="page-hdr-eyebrow" data-i18n="head_context"></p>
        <h1 class="page-hdr-title" data-i18n="contact_page_title"></h1>
      </div>

      <section class="sec">
        <div class="sec-inner">
          <p class="sec-num">01</p>
          <h2 class="sec-title" data-i18n="contact_join_title"></h2>
          <div class="sec-body">
            <p data-i18n="contact_join_p"></p>
          </div>
          <dl class="meta">
            <dt data-i18n="contact_dt1"></dt>
            <dd data-i18n="contact_dd1"></dd>
            <dt data-i18n="contact_dt2"></dt>
            <dd data-i18n="contact_dd2"></dd>
            <dt data-i18n="contact_dt3"></dt>
            <dd data-i18n="contact_dd3"></dd>
            <dt data-i18n="contact_dt4"></dt>
            <dd data-i18n="contact_dd4"></dd>
          </dl>
          <div class="form-wrap">
            <iframe
              title="application form"
              src="https://forms.gle/R35PpXwjAtUJZg6e7"
              width="100%"
              height="720"
              loading="lazy"
              frameborder="0"
              marginheight="0"
              marginwidth="0"
              >Loading…</iframe
            >
            <p class="form-note" data-i18n="contact_form_note"></p>
          </div>
        </div>
      </section>

      <section class="sec sec-alt">
        <div class="sec-inner">
          <p class="sec-num">02</p>
          <h2 class="sec-title" data-i18n="contact_faq_title"></h2>
          <div class="faq">
            <details>
              <summary data-i18n="faq_q1"></summary>
              <p data-i18n="faq_a1"></p>
            </details>
            <details>
              <summary data-i18n="faq_q2"></summary>
              <p data-i18n="faq_a2"></p>
            </details>
            <details>
              <summary data-i18n="faq_q3"></summary>
              <p data-i18n="faq_a3"></p>
            </details>
            <details>
              <summary data-i18n="faq_q4"></summary>
              <p data-i18n="faq_a4"></p>
            </details>
            <details>
              <summary data-i18n="faq_q5"></summary>
              <p data-i18n="faq_a5"></p>
            </details>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-inner">
          <p class="sec-num">03</p>
          <h2 class="sec-title" data-i18n="contact_mail_title"></h2>
          <div class="mail-block">
            <p data-i18n="contact_mail_p"></p>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/i18n.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/lang.js"></script>
  </body>
</html>
